<!doctype html>
<html lang="en" data-mode="deep">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Messages | EquiStaff</title>
<meta name="description" content="Your conversations with the EquiStaff team and with employers.">
<link rel="canonical" href="https://www.equistaff.com/messages.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="EquiStaff">
<meta property="og:image" content="https://www.equistaff.com/img/hero.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Lato:wght@300;400;700;900&family=Azeret+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/tokens.css"><link rel="stylesheet" href="src/styles.css"><link rel="stylesheet" href="src/chat.css"><link rel="stylesheet" href="src/screens.css">
<style>
/* MESSAGES — the live site mixes employer messages and admin notices into one
   inbox with a toggle, which the audit flagged. Two tabs instead, because a
   note from the recruiting team and a note from a barn need different attention. */
.msWrap{display:grid;grid-template-columns:340px 1fr;gap:var(--s-7);align-items:start}
.msTabs{display:flex;gap:4px;background:rgba(255,255,255,.06);border:1px solid var(--portal-line);border-radius:var(--r-pill);padding:4px;margin-bottom:var(--s-5)}
.msTabs button{flex:1;background:none;border:0;color:var(--baby-200);cursor:pointer;padding:10px;border-radius:var(--r-pill);font:700 var(--t-label)/1 var(--font-body);min-height:40px}
.msTabs button[aria-pressed="true"]{background:var(--baby-200);color:var(--navy-900)}
.msItem{display:grid;grid-template-columns:auto 1fr;gap:var(--s-4);padding:var(--s-4);border-radius:var(--r-md);cursor:pointer;border:1px solid transparent;margin-bottom:6px}
.msItem:hover{background:var(--surface-raised)}
.msItem[aria-current="true"]{background:var(--surface-raised);border-color:var(--baby-300)}
.msAv{width:42px;height:42px;border-radius:50%;background:var(--baby-200);color:var(--navy-900);display:grid;place-items:center;font:900 .875rem/1 var(--font-body);flex:0 0 auto;overflow:hidden}
.msAv img{width:100%;height:100%;object-fit:cover}
.msItem b{display:block;color:#fff;font-size:var(--t-small)}
.msItem p{margin:2px 0 0;font-size:var(--t-label);color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 23 Oct — an 8px dot was the only thing separating read from unread, which
   is not enough to scan a list by. Unread now changes four things at once:
   a left accent, a brighter ground, the name in white bold, and a labelled
   dot. Read rows recede rather than unread rows merely gaining a speck. */
.msUnread{width:9px;height:9px;border-radius:50%;background:var(--warm);align-self:center;flex:0 0 auto;
  box-shadow:0 0 0 3px rgba(249,244,237,.18)}
.msItem--unread{background:rgba(189,227,255,.09);box-shadow:inset 3px 0 0 0 var(--warm)}
.msItem--unread b{color:#fff;font-weight:900}
.msItem--unread p{color:var(--baby-200)}
.msItem--read b{color:var(--baby-200);font-weight:600}
.msItem--read .msAv{opacity:.72}
.msCount{display:inline-block;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--warm);
  color:var(--warm-ink);font:900 11px/18px var(--font-body);margin-left:6px;vertical-align:1px}
.msTabs button[aria-pressed="true"] .msCount{background:var(--navy-900);color:#fff}
.msBar{display:flex;justify-content:space-between;align-items:center;gap:var(--s-4);margin-bottom:var(--s-4)}
.msBar button{background:none;border:0;color:var(--baby-200);cursor:pointer;font:600 var(--t-label)/1 var(--font-body);
  text-decoration:underline;padding:6px}
.msBar button:hover{color:#fff}
/* 31 Oct — the thread scrolls like any messaging app: newest at the bottom,
   older messages above it, and it opens scrolled to the latest. */
.msPane{background:var(--surface-raised);border:1px solid var(--border-subtle);border-radius:var(--r-lg);display:flex;flex-direction:column;height:min(72vh,680px);min-height:420px}
.msHead{padding:var(--s-5) var(--s-6);border-bottom:1px solid var(--portal-line);display:flex;gap:var(--s-4);align-items:center}
.msHead b{color:#fff}.msHead span{color:var(--text-muted);font-size:var(--t-label);display:block}
.msBody{padding:var(--s-6);display:flex;flex-direction:column;gap:var(--s-4);flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.msBody > :first-child{margin-top:auto}
.bubDay{align-self:center;font:700 10px/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--baby-300)}
.bub{max-width:76%;padding:12px 16px;border-radius:14px;font-size:var(--t-small);line-height:1.55}
.bub--them{background:var(--portal-ground,#102F52);color:#fff;border-bottom-left-radius:4px;align-self:flex-start}
.bub--me{background:var(--baby-200);color:var(--navy-900);align-self:flex-end;border-bottom-right-radius:4px;font-weight:600}
.bubTime{font-size:10px;font-family:var(--font-mono);color:var(--baby-300);margin-top:4px;display:block}
.msFoot{border-top:1px solid var(--portal-line);padding:var(--s-4) var(--s-6);display:flex;gap:10px;align-items:center}
.msFoot input{flex:1;background:var(--portal-sunken);border:1.5px solid var(--portal-edge);border-radius:var(--r-pill);color:#fff;padding:12px 18px;font:inherit;font-size:var(--t-small);min-height:46px}
.msFoot input::placeholder{color:#7FA3C4}
@media(max-width:900px){.msWrap{grid-template-columns:1fr}.msWrap>*{min-width:0}}
@media(max-width:680px){.msBar button{min-height:44px}.msItem p{font-size:var(--t-small)}.msFoot{padding:var(--s-4)}.msFoot input{min-width:0;flex:1 1 auto}}
</style>
</head>
<body class="portal">
<a class="skip" href="#main">Skip to content</a>
<div id="nav" data-nav="seeker"></div>
<script>
/* 31 Oct — the employer nav links here too. ?as=employer (or arriving from an
   employer page) shows the employer inbox and nav; seekers are unchanged.
   Set before nav.js runs, which reads data-nav. */
var AS = (function(){
  var q = new URLSearchParams(location.search).get('as');
  var EMP = ['employer.html','my-jobs.html','billing.html','company.html','post-job.html','applicants.html','candidate.html'];
  var SEEK = ['profile.html','applications.html','saved.html','settings.html','jobs.html','job-detail.html','resume.html'];
  var ref = ''; try { ref = new URL(document.referrer).pathname.split('/').pop(); } catch (e) {}
  var v = q === 'employer' || q === 'seeker' ? q
        : EMP.indexOf(ref) > -1 ? 'employer'
        : SEEK.indexOf(ref) > -1 ? 'seeker' : null;
  try { if (v) sessionStorage.setItem('equistaff.msgAs', v); else v = sessionStorage.getItem('equistaff.msgAs'); } catch (e) {}
  return v === 'employer' ? 'employer' : 'seeker';
})();
if (AS === 'employer') document.getElementById('nav').setAttribute('data-nav', 'employer');
</script>
<main id="main">
  <div class="wrap" style="padding-block:var(--s-7) var(--s-9)">
    <h1 style="color:#fff;margin:0 0 var(--s-6);font-size:2rem">Messages</h1>
    <div class="msWrap">
      <div>
        <div class="msBar">
          <span style="color:var(--baby-300);font:600 var(--t-label)/1 var(--font-body)">Your messages</span>
          <button type="button" id="markAll" onclick="markAllRead()" hidden>Mark all as read</button>
        </div>
        <div class="msTabs" role="group" aria-label="Filter messages">
          <button aria-pressed="true"  onclick="tab('all',this)">All</button>
          <button aria-pressed="false" onclick="tab('unread',this)">Unread<span class="msCount" id="unreadN">0</span></button>
          <button aria-pressed="false" onclick="tab('team',this)">Recruiting Team</button>
          <button aria-pressed="false" onclick="tab('barn',this)" id="otherTab">Employers</button>
        </div>
        <div id="list"></div>
      </div>
      <div class="msPane">
        <div class="msHead" id="pHead"></div>
        <div class="msBody" id="pBody"></div>
        <div class="msFoot">
          <input id="say" placeholder="Write a reply…" aria-label="Write a reply" onkeydown="if(event.key==='Enter')send()">
          <button class="btn btn--primary" type="button" onclick="send()">Send</button>
        </div>
      </div>
    </div>
  </div>
</main>
<script>
var T = AS === 'employer' ? [
 { id:'e1', kind:'team', who:'Recruiting Team', sub:'EquiStaff · Barn Manager search', img:'img/kaitlin.jpg', unread:true,
   msgs:[['day','Last week'],
         ['them','Thanks for the brief on the barn manager role. I have a few people in mind already and I am calling references this week.','Tue 10:04'],
         ['me','Great. Housing is the one-bed over the office, if that helps anyone decide.','Tue 11:20'],
         ['them','It does. Two of them asked about exactly that.','Tue 11:42'],
         ['day','This week'],
         ['them','Your shortlist is ready to review in Your searches. Every reference has been checked by phone.','Mon 9:02'],
         ['them','Let me know who you would like to meet and I will set it up.','Mon 9:03']]},
 { id:'e2', kind:'barn', who:'Ruby Calloway', sub:'Applied to Part-time Groom · job board', img:'img/people/ruby.jpg', unread:false,
   msgs:[['them','Hi, I saw the part-time groom post. Are weekend mornings part of it?','Thu 18:10'],
         ['me','Saturdays, yes. Sundays are covered. Happy to talk it through.','Fri 08:45']]},
 { id:'e3', kind:'team', who:'EquiStaff', sub:'Automatic · job post', img:'', unread:false,
   msgs:[['them','Your Part-time Groom post has had 203 views and 2 applicants. Want Kaitlin to take a look at the wording?','Wed 07:00']]}
] : [
 { id:'t1', kind:'team', who:'Recruiting Team', sub:'EquiStaff recruiting', img:'img/kaitlin.jpg', unread:true,
   msgs:[['day','Last week'],
         ['them','Hi Dana, thanks for applying for the barn manager role. I have your resume and I am calling your references this week.','Wed 10:15'],
         ['me','Thank you. Best time to reach my last manager is after 2pm.','Wed 12:40'],
         ['them','Noted, I will call her then.','Wed 12:52'],
         ['them','Both references came back glowing. I have put you forward.','Fri 16:05'],
         ['day','This week'],
         ['them','Dana — good news. Golden Ocala want to meet you about the barn manager role. Are you free Thursday morning?','Mon 9:12'],
         ['them','I\u2019ve sent them your references already, so this is just a conversation, not an interview in the scary sense.','Mon 9:13']]},
 { id:'t2', kind:'barn', who:'Clearwater Sport Horses', sub:'Head Groom · you applied 1 week ago', img:'', unread:false,
   msgs:[['them','Thanks for applying. We\u2019re working through applications this week and will come back to you either way.','Thu 14:02'],
         ['me','Understood — thank you for letting me know.','Thu 16:30']]},
 { id:'t3', kind:'team', who:'EquiStaff', sub:'Automatic · job alert', img:'', unread:false,
   msgs:[['them','Three new barn manager roles in Ocala this week, two with housing. Want me to send these weekly?','Tue 07:00']]}
];
var CUR = T[0].id, VIEW = 'all';
function esc(s){return (s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function initials(n){return n.split(' ').map(function(w){return w[0];}).slice(0,2).join('').toUpperCase();}
function paintList(){
  var rows = T.filter(function(t){ return VIEW==='all' ? true : VIEW==='unread' ? t.unread : t.kind===VIEW; });
  document.getElementById('list').innerHTML = rows.map(function(t){
    var av = t.img ? '<span class="msAv"><img src="'+t.img+'" alt=""></span>' : '<span class="msAv">'+initials(t.who)+'</span>';
    var last = t.msgs.filter(function(m){ return m[0] !== 'day'; }).slice(-1)[0];
    var cls = 'msItem ' + (t.unread ? 'msItem--unread' : 'msItem--read');
    var from = t.kind === 'team' ? ' <span style="font:700 10px/1 var(--font-body);letter-spacing:.07em;'
             + 'text-transform:uppercase;color:var(--warm)">· EquiStaff</span>' : '';
    return '<div class="'+cls+'" aria-current="'+(t.id===CUR)+'" onclick="open_(\''+t.id+'\')">'+av
      + '<div style="min-width:0"><b>'+esc(t.who)+from+'</b><p>'+esc(last[1])+'</p></div>'
      + (t.unread ? '<span class="msUnread" title="Unread" aria-label="Unread"></span>' : '') + '</div>';
  }).join('');
  var n = T.filter(function(x){ return x.unread; }).length;
  var badge = document.getElementById('unreadN');
  if (badge) { badge.textContent = n; badge.style.display = n ? '' : 'none'; }
  var mk = document.getElementById('markAll');
  if (mk) mk.hidden = !n;
  var empty = document.getElementById('list');
  if (!rows.length) empty.innerHTML = '<p style="color:var(--baby-200);font-size:var(--t-small);padding:var(--s-5)">'
    + 'Nothing unread. You are all caught up.</p>';
}
function paintPane(){
  var t = T.find(function(x){return x.id===CUR;});
  var av = t.img ? '<span class="msAv"><img src="'+t.img+'" alt=""></span>' : '<span class="msAv">'+initials(t.who)+'</span>';
  document.getElementById('pHead').innerHTML = av + '<div><b>'+esc(t.who)+'</b><span>'+esc(t.sub)+'</span></div>';
  var body = document.getElementById('pBody');
  body.innerHTML = t.msgs.map(function(m){
    if (m[0] === 'day') return '<p class="bubDay">'+esc(m[1])+'</p>';
    return '<div class="bub bub--'+(m[0]==='me'?'me':'them')+'">'+esc(m[1])+'<span class="bubTime">'+m[2]+'</span></div>';
  }).join('');
  body.scrollTop = body.scrollHeight;  // open on the newest message
}
if (AS === 'employer') { document.getElementById('otherTab').textContent = 'Candidates'; }
function open_(id){ CUR=id; var t=T.find(function(x){return x.id===id;}); t.unread=false; paintList(); paintPane(); }
function tab(v,b){ VIEW=v; document.querySelectorAll('.msTabs button').forEach(function(x){x.setAttribute('aria-pressed','false');}); b.setAttribute('aria-pressed','true'); paintList(); }
function send(){
  var i=document.getElementById('say'), v=i.value.trim(); if(!v) return;
  T.find(function(x){return x.id===CUR;}).msgs.push(['me',v,'Just now']);
  i.value=''; paintList(); paintPane();
}
paintList(); paintPane();
</script>
<footer class="ftr" style="background:var(--portal-sunken);border-top:1px solid var(--portal-line)">
  <div class="wrap"><div class="ftr__bar" style="border:0;margin:0;padding:0">
    <span>&copy; 2026 EquiStaff &middot; Equine recruiting since 1982</span><span>Privacy &middot; Terms &middot; Accessibility</span>
  </div></div>
</footer>
<script src="src/state.js"></script>
<script src="src/nav.js"></script>

<script>
function markAllRead() {
  T.forEach(function (t) { t.unread = false; });
  paintList();
  if (window.ES && ES.notify) ES.notify('All messages marked as read');
}
</script>

<script src="src/revised.js"></script>
<script>REVISED('1 Nov', [
  "Recruiting Team threads no longer carry Kaitlin's name underneath; they read EquiStaff.",
  "The \"Kaitlin\" filter and thread are now \"Recruiting Team\".",
  "Threads scroll like normal messaging: newest at the bottom, older messages above, and it opens on the latest.",
  "Employers get their own inbox (from the employer pages, or ?as=employer): the employer nav, the recruiting team about their search, and candidates in place of employers. Job seekers see the same inbox as before.",
  "Hovering a card no longer lifts it. The job cards, the start-page tour cards, the 404 card and the job rows all shifted on hover and carried their text with them. They now respond with a shadow and a border instead, so nothing moves. Swept all 35 screens: no hover moves text anywhere.",
  "Pressing a button no longer nudges it. Every button dipped 1px on press and took its own label down with it; the press now shows as a shade change instead, so nothing moves under your finger. Swept all 35 screens — 80 button states were doing it.","On a phone, the portal tabs now sit inside the header as a swipeable row, with a fade on the right to show there's more. Before, they hung below the header over the page.", "Text no longer touches the screen edge on a phone — there's a 20px margin on both sides.", "The reply box and Send button fit on smaller phones, message previews are 15px, and \"Mark all as read\" is easier to tap.", "Unread is no longer an 8px dot. Unread rows get a left accent, a brighter ground and a bolder name.", "New Unread filter with a live count, plus Mark all as read.", "Portal brightened — lighter, bluer, three surface levels instead of two."]);</script>
<script src="src/chat.js"></script>
</body>
