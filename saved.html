.svHead{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s-5);flex-wrap:wrap;margin-bottom:var(--s-6)}
.svNote{background:var(--surface-raised);border:1px solid var(--border-subtle);border-radius:var(--r-lg);

<body class="portal">
<a class="skip" href="#main">Skip to content</a>
<div id="nav" data-nav="seeker"></div>
<main id="main">
  <div class="wrap" style="padding-block:var(--s-7) var(--s-9)">
    <div class="svHead">
      <div>
        <p class="eyebrow" style="color:var(--warm)">Job seeker</p>
        <h1 style="color:#fff;margin:0;font-size:2rem">Saved roles</h1>
      </div>
      <a class="btn btn--primary" href="jobs.html">Browse open roles</a>
    </div>
    <div id="list"></div>
    <div class="svNote">
      <b>Saving a role does not tell the employer anything.</b> It is just a list for you. Nothing is sent
      until you apply, and nobody sees what you have kept here.
    </div>
  </div>
</main><footer class="ftr" style="background:var(--portal-sunken);border-top:1px solid var(--portal-line)">
  <div class="wrap"><div class="ftr__bar" style="border:0;margin:0;padding:0">
    <span>&copy; 2026 EquiStaff &middot; Equine staffing since 1982</span>
    <span><a href="privacy.html">Privacy</a> &middot; <a href="terms.html">Terms</a> &middot; Accessibility</span>
  </div></div>
</footer>
<script src="src/state.js"></script><script src="src/nav.js"></script>
<script>
function esc(s){return (s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function paint(){
  var rows = ES.saved();
  document.getElementById('list').innerHTML = rows.length ? rows.map(function(r){
    var org = esc(r.org);
    return '<div class="appRow"><div><h4>'+esc(r.title)+'</h4>'
      + '<p>'+org+' · '+esc(r.where)+(r.pay?' · '+esc(r.pay):'')+'</p></div>'
      + '<div style="display:flex;gap:var(--s-3);flex-wrap:wrap">'
      + '<button class="btn btn--secondary" type="button" onclick="drop(\''+r.title.replace(/'/g,"\\'")+'\')">Remove</button>'
      + '<a class="btn btn--primary" href="job-detail.html">View role</a></div></div>';
  }).join('') : '<div class="empty"><p>You haven\u2019t saved any roles yet. Tap <b>Save for later</b> on any listing and it will be here.</p><a class="btn btn--primary" href="jobs.html">Browse 214 open roles</a></div>';
}
function drop(t){ ES.toggleSave({title:t}); paint(); }
paint();
</script>
